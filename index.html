<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OIDC PKCE Master Hub & Multi-Language SDK Lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z'/></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Immediate Theme Initializer (Default: Light) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('oidc_hub_theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
  <style>
    body { font-family: 'Cairo', 'Inter', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-full flex flex-col bg-slate-50 text-slate-900 bg-gradient-to-b from-slate-50 via-white to-indigo-50/30 dark:bg-slate-950 dark:text-slate-100 dark:bg-gradient-to-b dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950/40 antialiased">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-950/90 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 shadow-sm dark:shadow-none">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-2">
        
        <!-- Logo & Title -->
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/25 flex-shrink-0">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap sm:flex-nowrap">
              <h1 id="app-header-title" class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white tracking-tight truncate">OIDC PKCE Hub</h1>
              <span class="text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 font-semibold border border-indigo-200 dark:border-indigo-500/30" dir="ltr">RFC 7636</span>
            </div>
            <p id="app-header-subtitle" class="hidden md:block text-[11px] text-slate-500 dark:text-slate-400 truncate">مختبر تفاعلي لتطبيق OpenID Connect Code Flow with PKCE عبر مختلف اللغات وحزم SDK المعتمدة</p>
          </div>
        </div>

        <!-- Right Side: Theme Toggle, Language Toggle, and Discovery Link -->
        <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
          
          <!-- Theme Toggle Button (Light/Dark) -->
          <button id="theme-toggle-btn" class="text-xs px-2.5 sm:px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-800 transition-all flex items-center gap-1 font-semibold">
            <!-- Icon and label injected dynamically by theme.js -->
          </button>

          <!-- Language Toggle Button (Arabic/English) -->
          <button id="lang-toggle-btn" class="text-xs px-2.5 sm:px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/80 hover:bg-indigo-100 dark:hover:bg-indigo-900/80 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 transition-all flex items-center gap-1 font-semibold">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
            <span class="text-xs">English</span>
          </button>

          <!-- Discovery Endpoint Link -->
          <a id="header-discovery-link" href="/.well-known/openid-configuration" target="_blank" class="hidden sm:inline-flex text-xs px-2.5 sm:px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-indigo-600 dark:text-indigo-300 border border-slate-200 dark:border-slate-800 transition-all items-center gap-1.5 shadow-sm dark:shadow-none">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            <span>JSON</span>
          </a>
        </div>

      </div>

      <!-- Navigation Tabs (Touch-scrollable on mobile) -->
      <nav class="flex space-x-1 sm:space-x-2 space-x-reverse border-t border-slate-200 dark:border-slate-800/80 py-2 overflow-x-auto no-scrollbar text-xs font-semibold -mx-3 px-3 sm:mx-0 sm:px-0">
        <button data-tab="live-lab" class="nav-tab-btn px-3.5 py-2 rounded-xl transition-all border border-indigo-500 text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-500/10 flex items-center gap-1.5 whitespace-nowrap flex-shrink-0">
          🚀 <span class="tab-text">مختبر PKCE</span>
        </button>

        <button data-tab="mobile" class="nav-tab-btn px-3.5 py-2 rounded-xl transition-all border border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900 flex items-center gap-1.5 whitespace-nowrap flex-shrink-0">
          📱 <span class="tab-text">الموبايل و Flutter</span>
        </button>

        <button data-tab="spa" class="nav-tab-btn px-3.5 py-2 rounded-xl transition-all border border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900 flex items-center gap-1.5 whitespace-nowrap flex-shrink-0">
          🌐 <span class="tab-text">تطبيقات SPA</span>
        </button>

        <button data-tab="backend" class="nav-tab-btn px-3.5 py-2 rounded-xl transition-all border border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900 flex items-center gap-1.5 whitespace-nowrap flex-shrink-0">
          🖥️ <span class="tab-text">الخلفية (Backend)</span>
        </button>

        <button data-tab="tools" class="nav-tab-btn px-3.5 py-2 rounded-xl transition-all border border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900 flex items-center gap-1.5 whitespace-nowrap flex-shrink-0">
          🧰 <span class="tab-text">الأدوات والأمان</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Dynamic View Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="main-content-area">
      <!-- Injected by app.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800/80 py-6 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-slate-500">
      <div class="flex items-center gap-2">
        <span id="footer-specs-text">OpenID Connect Core 1.0 &bull; RFC 7636 (PKCE) &bull; RFC 8252 (OAuth for Apps) &bull; OAuth 2.1</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="/mock-idp/jwks.json" target="_blank" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">نقطة JWKS</a>
        <a href="/mock-idp/userinfo" target="_blank" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">نقطة UserInfo</a>
        <a href="/mock-idp/.well-known/openid-configuration" target="_blank" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">بيانات OpenID Metadata</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="./js/theme.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/pkce-engine.js"></script>
  <script src="./js/virtual-op.js"></script>
  <script src="./js/sdk-catalog.js"></script>
  <script src="./js/mobile-simulators.js"></script>
  <script src="./js/live-lab.js"></script>
  <script src="./js/tools.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
