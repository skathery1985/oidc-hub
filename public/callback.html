<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OIDC PKCE Callback Handler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-100">
  
  <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-xl text-center space-y-4">
    
    <div class="w-12 h-12 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto">
      <div class="w-6 h-6 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div>
      <h2 class="text-lg font-bold text-white" id="status-title">Processing OIDC Callback...</h2>
      <p class="text-xs text-slate-400 mt-1" id="status-subtitle">Extracting authorization code & validating state</p>
    </div>

    <!-- Callback query params inspection -->
    <div id="params-box" class="text-left bg-slate-950 p-3.5 rounded-xl border border-slate-800 text-xs font-mono space-y-1 text-slate-300">
      <!-- Injected -->
    </div>

    <div class="text-[11px] text-slate-500">
      If opened in a popup window, this will close automatically.
    </div>

  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');
      const error_description = urlParams.get('error_description');

      const paramsBox = document.getElementById('params-box');
      const statusTitle = document.getElementById('status-title');
      const statusSubtitle = document.getElementById('status-subtitle');

      paramsBox.innerHTML = `
        <div class="truncate"><span class="text-slate-500">code:</span> <span class="text-amber-300">${code || 'null'}</span></div>
        <div class="truncate"><span class="text-slate-500">state:</span> <span class="text-indigo-300">${state || 'null'}</span></div>
        ${error ? `<div class="text-rose-400"><span class="text-slate-500">error:</span> ${error} (${error_description || ''})</div>` : ''}
      `;

      // If opened in popup by opener
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({
          type: 'OIDC_CALLBACK',
          code,
          state,
          error,
          error_description
        }, window.location.origin);

        statusTitle.textContent = 'Authorization Code Sent!';
        statusSubtitle.textContent = 'Closing popup window and transferring code to playground...';

        setTimeout(() => {
          window.close();
        }, 500);
      } else {
        statusTitle.textContent = 'Callback Received';
        statusSubtitle.textContent = 'You can copy the code above into the PKCE Lab Step 3.';
      }
    })();
  </script>
</body>
</html>
