<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OIDC PKCE Master Hub & Multi-Language SDK Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-full flex flex-col bg-slate-950 bg-gradient-to-b from-slate-950 via-slate-900 to-indigo-950/40 text-slate-100 antialiased">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Logo & Title -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/25">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-base font-extrabold text-white tracking-tight">OIDC PKCE Hub</h1>
              <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-semibold border border-indigo-500/30">RFC 7636</span>
            </div>
            <p class="text-[11px] text-slate-400">OpenID Connect Code Flow with PKCE Across Certified SDKs</p>
          </div>
        </div>

        <!-- Right Side: Live Traffic Activity Badge & Discovery Link -->
        <div class="flex items-center gap-3">
          <div id="live-event-badge" class="hidden sm:inline-flex items-center gap-1.5 text-[11px] font-mono px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-slate-400">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Mock OP Ready
          </div>

          <a href="/.well-known/openid-configuration" target="_blank" class="text-xs px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-indigo-300 border border-slate-800 transition-all flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            Discovery JSON
          </a>
        </div>

      </div>

      <!-- Navigation Tabs -->
      <nav class="flex space-x-1 sm:space-x-2 border-t border-slate-800/80 py-2 overflow-x-auto custom-scrollbar text-xs font-semibold">
        <button data-tab="live-lab" class="nav-tab-btn px-4 py-2 rounded-xl transition-all border border-indigo-500 text-indigo-400 bg-indigo-500/10 flex items-center gap-2 whitespace-nowrap">
          🚀 Live PKCE Lab (Interactive)
        </button>

        <button data-tab="mobile" class="nav-tab-btn px-4 py-2 rounded-xl transition-all border border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900 flex items-center gap-2 whitespace-nowrap">
          📱 Mobile & Flutter (iOS / Android)
        </button>

        <button data-tab="spa" class="nav-tab-btn px-4 py-2 rounded-xl transition-all border border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900 flex items-center gap-2 whitespace-nowrap">
          🌐 Single Page App (SPA) SDKs
        </button>

        <button data-tab="backend" class="nav-tab-btn px-4 py-2 rounded-xl transition-all border border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900 flex items-center gap-2 whitespace-nowrap">
          🖥️ Non-SPA / Backend SDKs
        </button>

        <button data-tab="tools" class="nav-tab-btn px-4 py-2 rounded-xl transition-all border border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900 flex items-center gap-2 whitespace-nowrap">
          🧰 Dev Tools & Threat Matrix
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Dynamic View Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="main-content-area">
      <!-- Injected by app.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-950 border-t border-slate-800/80 py-6 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-slate-500">
      <div class="flex items-center gap-2">
        <span>OpenID Connect Core 1.0 &bull; RFC 7636 (PKCE) &bull; RFC 8252 (OAuth for Apps) &bull; OAuth 2.1</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="/mock-idp/jwks.json" target="_blank" class="hover:text-indigo-400 transition-colors">JWKS Endpoint</a>
        <a href="/mock-idp/userinfo" target="_blank" class="hover:text-indigo-400 transition-colors">UserInfo Endpoint</a>
        <a href="/mock-idp/.well-known/openid-configuration" target="_blank" class="hover:text-indigo-400 transition-colors">OpenID Metadata</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/js/pkce-engine.js"></script>
  <script src="/js/sdk-catalog.js"></script>
  <script src="/js/mobile-simulators.js"></script>
  <script src="/js/live-lab.js"></script>
  <script src="/js/tools.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
